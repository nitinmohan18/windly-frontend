<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windly - Severe Weather Alert</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/enhancements.css">
    <style>
        body {
            background: linear-gradient(135deg, #1b0a2b 0%, #3a0000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.9);
        }
        .alert-container {
            background: rgba(20, 10, 30, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: slideUp 0.5s ease-out forwards;
        }
        .alert-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }
        .alert-header .material-icons {
            font-size: 2.5rem;
            color: #ff3b30;
            filter: drop-shadow(0 0 15px rgba(255, 59, 48, 0.6));
        }
        .alert-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff;
            margin: 0;
            line-height: 1.3;
        }
        .alert-section {
            margin-bottom: 30px;
        }
        .alert-section h2 {
            font-size: 1rem;
            color: #ff8c50;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .alert-section p {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            white-space: pre-wrap;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            .alert-container { padding: 25px; }
            .alert-header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="alert-container">
        <div class="alert-header">
            <span class="material-icons">warning</span>
            <h1 id="alert-headline">Loading Alert Details...</h1>
        </div>
        
        <div class="alert-section" id="desc-section" style="display: none;">
            <h2>Full Description</h2>
            <p id="alert-desc"></p>
        </div>
        
        <div class="alert-section" id="inst-section" style="display: none;">
            <h2>Action / Instruction</h2>
            <p id="alert-inst"></p>
        </div>
        
        <button class="back-btn" onclick="window.close()">
            <span class="material-icons">close</span>
            Close Report
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const headline = sessionStorage.getItem('windly_alert_headline');
            const desc = sessionStorage.getItem('windly_alert_desc');
            const inst = sessionStorage.getItem('windly_alert_instruction');

            if (headline) document.getElementById('alert-headline').textContent = headline;
            
            if (desc) {
                document.getElementById('desc-section').style.display = 'block';
                document.getElementById('alert-desc').textContent = desc;
            }
            
            if (inst) {
                document.getElementById('inst-section').style.display = 'block';
                document.getElementById('alert-inst').textContent = inst;
            }
        });
    </script>
</body>
</html>
